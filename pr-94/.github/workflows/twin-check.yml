name: twin-check
# Замок: страница дня, которую ведёт конвейер, правится только через двойник в AI_Projects.
# pull_request_target: скрипт и сборщик — из main, HTML заявки только читается как данные.
# Выключатель — переменная репо TWIN_CHECK_OFF=1; нет секрета TWIN_READ_KEY — замок спит.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ['**.html']
  workflow_dispatch:
    inputs:
      pr:
        description: номер заявки
        required: true
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: twin-check-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  twin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: .github
      - uses: actions/checkout@v4
        if: ${{ vars.TWIN_CHECK_OFF != '1' }}
        continue-on-error: true
        with:
          repository: arabelthera-dot/AI_Projects
          ssh-key: ${{ secrets.TWIN_READ_KEY }}
          path: proj
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /russian-civilization/platform/
            /russian-civilization/docs/data-model/
            /russian-civilization/tools/seo-head.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 .github/twin_check.py
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          PROJ: proj/russian-civilization
          TWIN_CHECK_OFF: ${{ vars.TWIN_CHECK_OFF }}
