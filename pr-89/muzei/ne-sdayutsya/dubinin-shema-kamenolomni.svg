<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Условная схема: ходы каменоломен под землёй, узкий лаз к поверхности">
  <title>Условная схема ходов Старокарантинских каменоломен (рисунок проекта, не план)</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a3a"/>
      <stop offset="1" stop-color="#2f3b45"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4234"/>
      <stop offset="1" stop-color="#1f1b16"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#rock)"/>
  <rect width="1200" height="220" fill="url(#sky)"/>
  <path d="M0,220 C180,212 300,228 470,218 S820,206 1000,222 S1140,216 1200,220" fill="none" stroke="#a89466" stroke-width="4"/>
  <g fill="none" stroke="#0e0c0a" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150,220 V330 Q150,420 300,420 H760 Q900,420 900,330" stroke-width="56"/>
    <path d="M430,420 V540 Q430,640 300,640 H180" stroke-width="56"/>
    <path d="M430,560 Q560,700 760,690 H1040" stroke-width="56"/>
    <path d="M760,420 V560" stroke-width="44"/>
    <path d="M900,330 V220" stroke-width="12"/>
  </g>
  <g fill="none" stroke="#3a3126" stroke-width="2" stroke-dasharray="4 10">
    <path d="M0,300 H1200"/><path d="M0,480 H1200"/><path d="M0,600 H1200"/><path d="M0,740 H1200"/>
  </g>
  <circle cx="900" cy="222" r="16" fill="#f2c45a"/>
  <circle cx="900" cy="222" r="34" fill="none" stroke="#f2c45a" stroke-opacity=".45" stroke-width="3"/>
  <g font-family="Inter, Arial, sans-serif" fill="#e7dcc0">
    <text x="40" y="70" font-size="30" font-weight="700">Старый Карантин · поверхность</text>
    <text x="40" y="276" font-size="24" fill="#c9b98f">под землёй — ходы каменоломен</text>
    <text x="930" y="300" font-size="26" fill="#f2c45a">узкий лаз</text>
    <text x="930" y="332" font-size="20" fill="#c9b98f">взрослый не пролезет</text>
    <text x="40" y="780" font-size="20" fill="#9c8f72">Условная схема, рисунок проекта — не план каменоломен</text>
  </g>
</svg>
