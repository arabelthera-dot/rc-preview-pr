<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Зимний переход русских войск через Балканы: заснеженные хребты, колонна у перевала и силуэт Софии в долине">
  <title>Русские войска Гурко переваливают заснеженные Балканы и спускаются в Софийскую долину — рисунок музея</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1420"/><stop offset="42%" stop-color="#17293c"/>
      <stop offset="72%" stop-color="#31424f"/><stop offset="100%" stop-color="#4a4740"/>
    </linearGradient>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8aa0b4" stop-opacity="0"/><stop offset="100%" stop-color="#e3c98a" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a5266"/><stop offset="100%" stop-color="#20303e"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20303f"/><stop offset="100%" stop-color="#111b26"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141f2b"/><stop offset="100%" stop-color="#0a0f17"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#sky)"/>
  <ellipse cx="880" cy="330" rx="460" ry="150" fill="url(#dawn)"/>
  <g fill="#ffffff" opacity=".5">
    <circle cx="150" cy="48" r="1.2"/><circle cx="300" cy="30" r="1"/><circle cx="452" cy="62" r="1.1"/>
    <circle cx="620" cy="26" r=".9"/><circle cx="1000" cy="38" r="1.1"/><circle cx="1120" cy="70" r="1"/>
    <circle cx="760" cy="80" r=".9"/>
  </g>
  <!-- дальний хребет: заснеженные Балканы -->
  <path d="M0 250 L110 176 L190 216 L300 128 L400 196 L500 150 L600 210 L700 168 L820 226 L930 172 L1050 232 L1200 190 L1200 420 L0 420 Z" fill="url(#far)" opacity=".9"/>
  <g fill="#c7d4e0" opacity=".7">
    <path d="M300 128 L336 174 L300 190 L268 176 Z"/><path d="M500 150 L534 194 L500 208 L470 194 Z"/>
    <path d="M930 172 L962 214 L930 226 L900 214 Z"/><path d="M110 176 L144 214 L110 226 L80 212 Z"/>
  </g>
  <!-- средний хребет с перевалом -->
  <path d="M0 300 L160 214 L280 282 L430 206 L560 292 L700 232 L840 300 L980 226 L1120 300 L1200 254 L1200 420 L0 420 Z" fill="url(#mid)"/>
  <g fill="#aebdca" opacity=".62">
    <path d="M430 206 L470 262 L430 276 L392 262 Z"/><path d="M980 226 L1016 278 L980 290 L946 278 Z"/>
    <path d="M160 214 L196 266 L160 278 L126 266 Z"/>
  </g>
  <!-- тропа через перевал -->
  <path d="M470 268 C 560 296, 640 300, 720 318 S 860 344, 940 356" fill="none" stroke="#d7dde4" stroke-width="3" stroke-linecap="round" opacity=".55" stroke-dasharray="2 9"/>
  <!-- колонна русских войск на тропе: силуэты и орудие -->
  <g fill="#05090f">
    <g id="col">
      <path d="M540 292 l4 -12 l4 12 z"/><rect x="540" y="292" width="8" height="9"/>
      <path d="M580 300 l4 -12 l4 12 z"/><rect x="580" y="300" width="8" height="9"/>
      <path d="M620 306 l4 -12 l4 12 z"/><rect x="620" y="306" width="8" height="9"/>
      <path d="M664 312 l4 -12 l4 12 z"/><rect x="664" y="312" width="8" height="9"/>
      <path d="M710 320 l4 -12 l4 12 z"/><rect x="710" y="320" width="8" height="9"/>
      <rect x="760" y="330" width="16" height="5"/><circle cx="764" cy="338" r="4.4"/><circle cx="774" cy="338" r="4.4"/>
      <path d="M760 330 l-30 -6 l0 -3 l30 4 z"/>
    </g>
  </g>
  <g stroke="#5a6b7c" stroke-width="1.4" opacity=".8">
    <path d="M640 292 l0 -22"/><path d="M700 300 l0 -20"/>
  </g>
  <!-- ближний хребет -->
  <path d="M0 360 L150 332 L300 356 L460 324 L620 360 L780 330 L940 364 L1100 336 L1200 360 L1200 420 L0 420 Z" fill="url(#near)"/>
  <!-- София в долине -->
  <g fill="#060b12">
    <rect x="836" y="352" width="8" height="26"/><path d="M836 352 L840 342 L844 352 Z"/>
    <rect x="856" y="346" width="30" height="32"/><path d="M856 346 a15 15 0 0 1 30 0 Z"/>
    <rect x="866" y="330" width="5" height="18"/><path d="M864 330 L868.5 320 L873 330 Z"/>
    <rect x="898" y="356" width="22" height="22"/><path d="M898 356 a11 11 0 0 1 22 0 Z"/>
    <rect x="930" y="350" width="34" height="28"/><path d="M930 350 L947 334 L964 350 Z"/>
    <rect x="976" y="358" width="18" height="20"/>
    <rect x="1002" y="352" width="26" height="26"/><path d="M1002 352 a13 13 0 0 1 26 0 Z"/>
    <rect x="1036" y="350" width="6" height="28"/><path d="M1034 350 L1039 338 L1044 350 Z"/>
  </g>
  <g stroke="#6f8194" stroke-width="1.2" opacity=".6">
    <path d="M871 344 l0 -14"/><path d="M1039 344 l0 -14"/>
    <circle cx="871" cy="328" r="2.2"/><circle cx="1039" cy="326" r="2.2"/>
  </g>
</svg>
