name: netlify-preview
# Превью каждой заявки — черновая выкладка Netlify (мировой стандарт deploy preview, М24 #1638):
# https://pr-N--rc-preview-museum.netlify.app/ — открывается из РФ, в отличие от pages.dev и vercel.app.
# Замена rc-preview-pr (папки pr-N упёрлись в 1 ГБ). Сайт целиком, как будет на main после слияния
# (merge-коммит заявки); Netlify докачивает только изменённые файлы. Ссылки на страницы заявки —
# одним комментарием в заявке, обновляется на каждый пуш.
# Пять вопросов: задевает — только комментарий в заявке и сайт rc-preview-museum на Netlify, main и
# Pages не трогает; нужно — секреты NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID; без них — шаг пропускается
# с пометкой, заявку не держит (проверка необязательная); откат — переменная репо NETLIFY_PREVIEW_OFF=1
# или удалить этот файл. Код заявки не исполняется: --no-build, netlify.toml и функции из заявки убираются.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: номер заявки
        required: true
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: netlify-preview-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  deploy:
    if: vars.NETLIFY_PREVIEW_OFF != '1' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      GH_TOKEN: ${{ github.token }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: секреты на месте
        id: keys
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::notice::нет секретов Netlify — превью спит"; echo ok=0 >> "$GITHUB_OUTPUT"
          else echo ok=1 >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.ok == '1'
        with:
          ref: refs/pull/${{ env.PR }}/merge
          path: site
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ok == '1'
        with:
          node-version: 22
      - name: выкладка на Netlify
        id: deploy
        if: steps.keys.outputs.ok == '1'
        run: |
          rm -rf site/.git site/.github site/netlify.toml site/netlify
          npx -y netlify-cli@27.12.1 deploy --dir=site --no-build --alias="pr-$PR" \
            --site="$NETLIFY_SITE_ID" --message="заявка #$PR $(date -u +%FT%TZ)" --json > deploy.json
          URL=$(jq -r '.deploy_url' deploy.json | sed -E 's#^https://[0-9a-f]+--#https://pr-'"$PR"'--#')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Превью: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: ссылки в заявке
        if: steps.keys.outputs.ok == '1'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          REPO: ${{ github.repository }}
        run: |
          MARK='<!-- netlify-preview -->'
          PAGES=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[]|select(.status!="removed")|.filename|select(endswith(".html"))')
          {
            echo "$MARK"
            echo "**Превью заявки (Netlify)** — весь сайт, как будет после слияния; открывается из РФ:"
            echo
            echo "- $URL/"
            for p in $PAGES; do echo "- $URL/$p"; done
          } > body.md
          ID=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq ".[]|select(.body|startswith(\"$MARK\"))|.id" | head -1)
          if [ -n "$ID" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@body.md >/dev/null
          else gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md >/dev/null; fi
