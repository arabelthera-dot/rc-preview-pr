<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Зимний Ленинград: шпиль Петропавловского собора над Невой, прожекторы в небе и салют">
  <title>Ленинград зимой: шпиль над Невой, прожекторы и салют — рисунок музея</title>
  <defs>
    <linearGradient id="sky27" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080f1a"/><stop offset="36%" stop-color="#132234"/>
      <stop offset="70%" stop-color="#2b4055"/><stop offset="100%" stop-color="#4c5560"/>
    </linearGradient>
    <linearGradient id="beam27" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe0f0" stop-opacity=".26"/><stop offset="100%" stop-color="#cfe0f0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="neva27" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4e6f8c"/><stop offset="100%" stop-color="#1b2a3a"/>
    </linearGradient>
    <linearGradient id="emb27" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3c50"/><stop offset="100%" stop-color="#111a25"/>
    </linearGradient>
    <radialGradient id="fire27" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b8" stop-opacity=".95"/><stop offset="100%" stop-color="#e8c98a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#sky27)"/>
  <!-- прожекторы -->
  <g fill="url(#beam27)">
    <path d="M300 320 L200 20 L250 20 Z"/>
    <path d="M300 320 L340 24 L392 26 Z"/>
    <path d="M900 316 L1010 30 L1060 34 Z"/>
  </g>
  <!-- салют: вспышки -->
  <g fill="url(#fire27)">
    <circle cx="240" cy="80" r="46"/><circle cx="360" cy="56" r="32"/>
    <circle cx="1010" cy="72" r="42"/><circle cx="1120" cy="110" r="26"/>
    <circle cx="700" cy="48" r="24"/>
  </g>
  <g fill="#ffe9b8" opacity=".8">
    <circle cx="240" cy="80" r="3"/><circle cx="1010" cy="72" r="3"/>
  </g>
  <g fill="#ffffff" opacity=".38">
    <circle cx="120" cy="46" r="1.1"/><circle cx="480" cy="34" r="1"/><circle cx="600" cy="70" r="1.1"/>
    <circle cx="820" cy="40" r="1"/><circle cx="930" cy="140" r=".9"/><circle cx="160" cy="150" r=".9"/>
  </g>
  <!-- дальний город: крыши и купол Исаакия -->
  <path d="M0 300 L120 288 L220 296 L330 282 L430 292 L520 280 L620 290 L720 278 L830 292 L940 282 L1060 294 L1200 284 L1200 420 L0 420 Z" fill="#16232f" opacity=".95"/>
  <path d="M790 282 A34 34 0 0 1 858 282 Z" fill="#1d2c3a"/>
  <rect x="820" y="240" width="8" height="44" fill="#1d2c3a"/>
  <!-- Петропавловский шпиль -->
  <g fill="#0d1721">
    <rect x="592" y="228" width="46" height="66"/>
    <rect x="608" y="150" width="14" height="80"/>
    <path d="M600 152 L615 96 L630 152 Z"/>
  </g>
  <g stroke="#c9a84c" stroke-width="1.6" opacity=".75">
    <line x1="615" y1="96" x2="615" y2="78"/>
  </g>
  <g fill="#e8c98a" opacity=".5">
    <rect x="600" y="246" width="5" height="7"/><rect x="616" y="246" width="5" height="7"/><rect x="630" y="256" width="5" height="7"/>
  </g>
  <!-- набережная -->
  <path d="M0 340 L200 332 L420 340 L640 330 L860 340 L1080 332 L1200 338 L1200 420 L0 420 Z" fill="url(#emb27)"/>
  <g stroke="#3d5266" stroke-width="2" opacity=".6">
    <path d="M0 352 L1200 348"/>
  </g>
  <!-- Нева, скованная льдом -->
  <path d="M0 372 C 220 356, 420 394, 640 374 S 1000 350, 1200 368" fill="none" stroke="url(#neva27)" stroke-width="16" stroke-linecap="round" opacity=".9"/>
  <!-- торосы и следы на льду -->
  <g stroke="#5b7b96" stroke-width="1.6" opacity=".45">
    <path d="M180 384 L240 378"/><path d="M420 388 L500 382"/><path d="M780 380 L860 374"/>
  </g>
  <!-- отражения салюта в Неве -->
  <g fill="#e8c98a" opacity=".16">
    <ellipse cx="640" cy="378" rx="70" ry="7"/><ellipse cx="240" cy="382" rx="48" ry="5"/>
  </g>
</svg>
