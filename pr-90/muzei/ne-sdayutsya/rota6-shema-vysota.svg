<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Условная схема: высота 776,0 над ущельем, 90 десантников на гребне, на них с низа ущелья идут боевики">
  <title>Условная схема боя на высоте 776,0 (рисунок проекта, не карта)</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2633"/>
      <stop offset="1" stop-color="#3a4552"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4636"/>
      <stop offset="1" stop-color="#1b211a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <path d="M0,560 L180,420 L330,470 L520,250 L640,230 L780,330 L930,300 L1200,470 V800 H0 Z" fill="url(#hill)"/>
  <path d="M0,800 L0,700 C200,690 380,740 600,720 S1000,700 1200,740 V800 Z" fill="#11150f"/>
  <path d="M60,760 C260,740 420,770 620,752 S980,736 1160,770" fill="none" stroke="#5d6b78" stroke-width="5" stroke-dasharray="14 10"/>
  <g fill="#f2c45a">
    <circle cx="560" cy="250" r="9"/><circle cx="590" cy="244" r="9"/><circle cx="620" cy="240" r="9"/>
    <circle cx="575" cy="270" r="9"/><circle cx="605" cy="264" r="9"/>
  </g>
  <g fill="#b0453a">
    <circle cx="300" cy="640" r="7"/><circle cx="340" cy="660" r="7"/><circle cx="380" cy="630" r="7"/><circle cx="420" cy="655" r="7"/>
    <circle cx="460" cy="625" r="7"/><circle cx="500" cy="650" r="7"/><circle cx="760" cy="640" r="7"/><circle cx="800" cy="665" r="7"/>
    <circle cx="840" cy="630" r="7"/><circle cx="880" cy="655" r="7"/><circle cx="920" cy="628" r="7"/><circle cx="960" cy="650" r="7"/>
  </g>
  <g fill="none" stroke="#b0453a" stroke-width="5" stroke-linecap="round">
    <path d="M420,600 L520,330"/><path d="M500,610 L560,320"/><path d="M800,600 L680,330"/><path d="M880,600 L720,350"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" fill="#e7dcc0">
    <text x="660" y="200" font-size="40" font-weight="700">776,0</text>
    <text x="660" y="236" font-size="22" fill="#f2c45a">6-я рота · 90 человек</text>
    <text x="60" y="720" font-size="22" fill="#c9a7a1">боевики идут из ущелья — от двух до трёх тысяч</text>
    <text x="40" y="60" font-size="26" font-weight="700">Аргунское ущелье · 29 февраля — 1 марта 2000</text>
    <text x="40" y="785" font-size="18" fill="#9c8f72">Условная схема, рисунок проекта — не карта боя</text>
  </g>
</svg>
