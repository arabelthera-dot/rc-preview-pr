<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Зимнее утро над Малоярославцем: город на холме над рекой Лужа и Варшавское шоссе, уходящее на запад">
  <title>Малоярославец зимой: город на холме над рекой Лужа и Варшавское шоссе — рисунок музея</title>
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1220"/><stop offset="42%" stop-color="#152539"/>
      <stop offset="72%" stop-color="#31414f"/><stop offset="100%" stop-color="#4a4a45"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fa3b8" stop-opacity="0"/><stop offset="100%" stop-color="#e0c68c" stop-opacity=".20"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3b4c"/><stop offset="100%" stop-color="#151f2b"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5f7d95"/><stop offset="100%" stop-color="#28394a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#sky2)"/>
  <ellipse cx="300" cy="316" rx="440" ry="150" fill="url(#glow2)"/>
  <g fill="#ffffff" opacity=".45">
    <circle cx="140" cy="48" r="1.2"/><circle cx="286" cy="30" r="1"/><circle cx="520" cy="58" r="1.1"/>
    <circle cx="700" cy="36" r="1"/><circle cx="900" cy="64" r="1.1"/><circle cx="1090" cy="42" r="1"/>
    <circle cx="980" cy="96" r=".9"/><circle cx="404" cy="88" r=".9"/>
  </g>
  <!-- дальний лес по горизонту -->
  <path d="M0 286 L90 268 L150 276 L230 258 L320 274 L420 254 L520 272 L610 256 L700 276 L800 262 L900 280 L1010 264 L1110 282 L1200 268 L1200 420 L0 420 Z" fill="#1b2a3a" opacity=".9"/>
  <!-- холм с городом -->
  <path d="M0 342 L180 300 L330 322 L470 286 L610 318 L760 296 L900 326 L1050 302 L1200 330 L1200 420 L0 420 Z" fill="url(#snow)"/>
  <!-- река Лужа -->
  <path d="M0 372 C 180 356, 340 392, 520 372 S 860 344, 1200 366" fill="none" stroke="url(#ice)" stroke-width="14" stroke-linecap="round" opacity=".85"/>
  <!-- город на холме: дома, колокольня, дым -->
  <g fill="#0a121c">
    <rect x="390" y="284" width="30" height="38"/><rect x="426" y="272" width="20" height="50"/>
    <rect x="452" y="290" width="34" height="32"/><rect x="492" y="278" width="18" height="44"/>
    <rect x="516" y="294" width="28" height="28"/><rect x="550" y="282" width="22" height="40"/>
    <rect x="578" y="296" width="32" height="26"/><rect x="616" y="286" width="18" height="36"/>
    <!-- колокольня -->
    <rect x="642" y="252" width="20" height="70"/><path d="M642 252 L652 230 L662 252 Z"/>
    <rect x="700" y="292" width="26" height="30"/><rect x="732" y="300" width="20" height="22"/>
  </g>
  <g stroke="#7d8fa2" stroke-width="1.4" opacity=".7">
    <line x1="652" y1="230" x2="652" y2="216"/>
  </g>
  <!-- дым над крышами -->
  <g fill="none" stroke="#8b9cad" stroke-width="2" opacity=".28">
    <path d="M436 268 C 428 254, 442 246, 434 232"/>
    <path d="M500 274 C 492 260, 506 252, 498 238"/>
  </g>
  <!-- Варшавское шоссе: уходит на запад, пунктир -->
  <path d="M1200 356 C 1040 348, 900 366, 760 352 S 500 336, 380 350 L 0 396" fill="none" stroke="#c9a84c" stroke-width="3" stroke-dasharray="12 9" opacity=".75"/>
  <!-- следы от техники на снегу -->
  <g stroke="#3d4f61" stroke-width="2" opacity=".55">
    <path d="M980 396 L 1180 380"/><path d="M986 404 L 1186 388"/>
  </g>
</svg>
