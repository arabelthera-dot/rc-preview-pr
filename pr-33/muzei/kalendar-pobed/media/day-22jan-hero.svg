<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Зимняя ночь над Инстербургом: замок на берегу Ангерапы и мост, за который шёл бой">
  <title>Инстербург зимой: замок над Ангерапой и мост — рисунок музея</title>
  <defs>
    <linearGradient id="sky22" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070d16"/><stop offset="38%" stop-color="#101d2c"/>
      <stop offset="70%" stop-color="#243646"/><stop offset="100%" stop-color="#3d4a52"/>
    </linearGradient>
    <linearGradient id="glow22" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fa3b8" stop-opacity="0"/><stop offset="100%" stop-color="#c9a84c" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="bank22" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26374a"/><stop offset="100%" stop-color="#121b26"/>
    </linearGradient>
    <linearGradient id="river22" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#46637c"/><stop offset="100%" stop-color="#1a2836"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#sky22)"/>
  <ellipse cx="600" cy="330" rx="620" ry="170" fill="url(#glow22)"/>
  <g fill="#ffffff" opacity=".5">
    <circle cx="100" cy="40" r="1.2"/><circle cx="240" cy="26" r="1"/><circle cx="420" cy="52" r="1.1"/>
    <circle cx="600" cy="22" r="1"/><circle cx="780" cy="48" r="1.2"/><circle cx="950" cy="30" r="1"/>
    <circle cx="1100" cy="66" r=".9"/><circle cx="330" cy="82" r=".9"/><circle cx="700" cy="90" r=".9"/>
  </g>
  <!-- дальний лес -->
  <path d="M0 280 L100 262 L190 274 L290 254 L390 272 L500 252 L600 270 L710 254 L820 274 L930 258 L1050 276 L1200 262 L1200 420 L0 420 Z" fill="#141f2c" opacity=".92"/>
  <!-- берег с замком -->
  <path d="M0 336 L200 306 L380 322 L560 296 L740 318 L900 300 L1060 322 L1200 308 L1200 420 L0 420 Z" fill="url(#bank22)"/>
  <!-- замок Инстербург: башня, стены -->
  <g fill="#080f18">
    <rect x="470" y="228" width="26" height="80"/>
    <path d="M470 228 L483 200 L496 228 Z"/>
    <rect x="504" y="252" width="60" height="56"/>
    <rect x="572" y="240" width="22" height="68"/>
    <path d="M572 240 L583 214 L594 240 Z"/>
    <rect x="600" y="262" width="48" height="46"/>
    <rect x="654" y="272" width="30" height="36"/>
    <!-- зубцы стены -->
    <path d="M420 300 L470 288 L470 302 L420 314 Z"/>
    <path d="M496 274 L504 274 L504 288 L496 288 Z"/>
  </g>
  <!-- освещённые окна -->
  <g fill="#e8c98a" opacity=".55">
    <rect x="512" y="264" width="5" height="7"/><rect x="528" y="264" width="5" height="7"/>
    <rect x="578" y="252" width="5" height="7"/><rect x="616" y="274" width="5" height="7"/>
  </g>
  <!-- Ангерапа -->
  <path d="M0 376 C 200 356, 400 396, 620 374 S 1000 348, 1200 370" fill="none" stroke="url(#river22)" stroke-width="18" stroke-linecap="round" opacity=".9"/>
  <!-- мост через Ангерапу — тот самый -->
  <g stroke="#0a1119" stroke-width="6" opacity=".95">
    <path d="M600 368 L760 360"/>
  </g>
  <g stroke="#0a1119" stroke-width="3" opacity=".85">
    <path d="M620 344 L620 376"/><path d="M660 342 L660 374"/><path d="M700 340 L700 372"/><path d="M740 348 L740 372"/>
  </g>
  <g stroke="#8b9cad" stroke-width="1.6" opacity=".5">
    <path d="M620 344 L700 340"/><path d="M700 340 L740 348"/>
  </g>
  <!-- дым и зарево над городом -->
  <g fill="none" stroke="#9aabbd" stroke-width="2.4" opacity=".22">
    <path d="M520 214 C 512 198, 528 190, 520 174"/>
    <path d="M660 236 C 652 220, 668 212, 660 196"/>
  </g>
  <ellipse cx="560" cy="206" rx="90" ry="30" fill="#c9a84c" opacity=".06"/>
  <!-- колонна на льду: следы техники -->
  <g stroke="#33465a" stroke-width="2" opacity=".6">
    <path d="M980 396 L1180 380"/><path d="M986 404 L1186 388"/>
  </g>
</svg>
