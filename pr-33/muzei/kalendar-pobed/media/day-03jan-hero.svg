<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Крепостная стена Троице-Сергиева монастыря с башнями и соборами за ней на рассвете">
  <title>Стена и башни Троице-Сергиева монастыря — рисунок музея</title>
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1018"/><stop offset="44%" stop-color="#152436"/>
      <stop offset="76%" stop-color="#2c3743"/><stop offset="100%" stop-color="#4a4032"/>
    </linearGradient>
    <linearGradient id="dawn3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c8ea0" stop-opacity="0"/><stop offset="100%" stop-color="#dcb977" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="wall3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2b39"/><stop offset="100%" stop-color="#0c131c"/>
    </linearGradient>
    <linearGradient id="dome3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7736"/><stop offset="100%" stop-color="#3a3320"/>
    </linearGradient>
    <linearGradient id="ground3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131d28"/><stop offset="100%" stop-color="#080d14"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#sky3)"/>
  <ellipse cx="330" cy="316" rx="460" ry="150" fill="url(#dawn3)"/>
  <g fill="#ffffff" opacity=".45">
    <circle cx="150" cy="46" r="1.2"/><circle cx="286" cy="30" r="1"/><circle cx="452" cy="58" r="1.1"/>
    <circle cx="1016" cy="38" r="1.1"/><circle cx="1132" cy="70" r="1"/><circle cx="660" cy="24" r=".9"/>
    <circle cx="880" cy="52" r="1"/>
  </g>

  <!-- дальний холм и лес за монастырём -->
  <path d="M0 296 L180 268 L360 288 L560 262 L760 290 L960 266 L1200 292 L1200 420 L0 420 Z" fill="#16222f" opacity=".8"/>
  <g fill="#0e1822">
    <path d="M60 292 L74 264 L88 292 Z"/><path d="M120 288 L134 258 L148 288 Z"/>
    <path d="M1042 290 L1056 262 L1070 290 Z"/><path d="M1104 294 L1118 266 L1132 294 Z"/>
  </g>

  <!-- соборы обители: купола за стеной -->
  <g>
    <rect x="556" y="176" width="52" height="126" fill="#243343"/>
    <path d="M556 176 Q582 132 608 176 Z" fill="url(#dome3)"/>
    <line x1="582" y1="132" x2="582" y2="106" stroke="#8a7736" stroke-width="3"/>
    <line x1="570" y1="114" x2="594" y2="114" stroke="#8a7736" stroke-width="3"/>

    <rect x="632" y="150" width="60" height="152" fill="#2a3b4c"/>
    <path d="M632 150 Q662 104 692 150 Z" fill="url(#dome3)"/>
    <line x1="662" y1="104" x2="662" y2="78" stroke="#8a7736" stroke-width="3"/>
    <line x1="650" y1="86" x2="674" y2="86" stroke="#8a7736" stroke-width="3"/>

    <rect x="446" y="204" width="42" height="98" fill="#1f2c3a"/>
    <path d="M446 204 Q467 170 488 204 Z" fill="#5d5230"/>

    <rect x="722" y="216" width="38" height="86" fill="#1f2c3a"/>
    <path d="M722 216 Q741 186 760 216 Z" fill="#5d5230"/>
  </g>

  <!-- крепостная стена с бойницами -->
  <g>
    <path d="M0 302 L0 356 L1200 356 L1200 302 Z" fill="url(#wall3)"/>
    <g fill="#243443">
      <path d="M20 302 h30 v-16 h-30 z M80 302 h30 v-16 h-30 z M140 302 h30 v-16 h-30 z
               M200 302 h30 v-16 h-30 z M260 302 h30 v-16 h-30 z M320 302 h30 v-16 h-30 z
               M380 302 h30 v-16 h-30 z M440 302 h30 v-16 h-30 z M500 302 h30 v-16 h-30 z
               M560 302 h30 v-16 h-30 z M620 302 h30 v-16 h-30 z M680 302 h30 v-16 h-30 z
               M740 302 h30 v-16 h-30 z M800 302 h30 v-16 h-30 z M860 302 h30 v-16 h-30 z
               M920 302 h30 v-16 h-30 z M980 302 h30 v-16 h-30 z M1040 302 h30 v-16 h-30 z
               M1100 302 h30 v-16 h-30 z M1160 302 h30 v-16 h-30 z"/>
    </g>
    <g fill="#060b11">
      <rect x="66" y="330" width="7" height="16"/><rect x="246" y="330" width="7" height="16"/>
      <rect x="426" y="330" width="7" height="16"/><rect x="606" y="330" width="7" height="16"/>
      <rect x="786" y="330" width="7" height="16"/><rect x="966" y="330" width="7" height="16"/>
      <rect x="1146" y="330" width="7" height="16"/>
    </g>
  </g>

  <!-- башни: три видимых, с шатровыми кровлями -->
  <g>
    <path d="M150 356 L150 250 L232 250 L232 356 Z" fill="#22313f"/>
    <path d="M142 250 L191 206 L240 250 Z" fill="#2c3f52"/>
    <rect x="169" y="286" width="16" height="26" fill="#070c12"/>
    <path d="M142 250 L191 206 L240 250" fill="none" stroke="#5a6b7c" stroke-width="1.6"/>

    <path d="M486 356 L486 232 L584 232 L584 356 Z" fill="#26374a"/>
    <path d="M476 232 L535 180 L594 232 Z" fill="#31465b"/>
    <rect x="519" y="272" width="18" height="30" fill="#070c12"/>
    <path d="M476 232 L535 180 L594 232" fill="none" stroke="#5a6b7c" stroke-width="1.6"/>

    <path d="M842 356 L842 244 L934 244 L934 356 Z" fill="#22313f"/>
    <path d="M834 244 L888 196 L942 244 Z" fill="#2c3f52"/>
    <rect x="862" y="282" width="16" height="26" fill="#070c12"/>
    <path d="M834 244 L888 196 L942 244" fill="none" stroke="#5a6b7c" stroke-width="1.6"/>
  </g>

  <!-- земля и дорога -->
  <path d="M0 356 L1200 356 L1200 420 L0 420 Z" fill="url(#ground3)"/>
  <path d="M960 420 C 900 396, 820 386, 760 382 L 700 380" fill="none" stroke="#2a3742" stroke-width="12" stroke-linecap="round"/>
</svg>
