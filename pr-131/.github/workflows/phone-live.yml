name: phone-live
# Раз в сутки весь живой сайт глазами телефона (iPhone 13, Pixel 7): пустая верхняя картинка,
# несуществующая страница. Скрипт — .github/phone_check.mjs. Выключатель — PHONE_CHECK_OFF=1.
on:
  schedule:
    - cron: '30 2 * * *'   # 05:30 МСК
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phone-live
  cancel-in-progress: true
jobs:
  phone:
    if: vars.PHONE_CHECK_OFF != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm i --no-save --no-audit --no-fund playwright@1.48
          npx playwright install --with-deps chromium
      - name: весь сайт на телефоне
        run: |
          PAGES="index.html map.html $(git ls-files 'muzei/*.html' 'izobreteniya/*.html' 'iskusstvo/*.html' 'pervoprohodcy/*.html' | tr '\n' ' ')" node .github/phone_check.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: phone-shots
          path: phone-shots/
