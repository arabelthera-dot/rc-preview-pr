name: kalendar-sverka

# Сверка: утверждённые таблицы control/pilot-<музей> == файлы данных календаря сайта.
# Настройка — tools/kalendar-sborka.json, исправление — python3 tools/kalendar-sborka.py --write <slug>.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sverka:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Тесты сборщика
        run: python3 -B tools/test-kalendar-sborka.py
      - name: Сверка календарей
        run: python3 -B tools/kalendar-sborka.py --check
